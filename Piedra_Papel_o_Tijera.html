<!DOCTYPE html/>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Piedra, Papel y Tijera</title>
        <script>
            function aleatorio(min, max) {
                return Math.floor(Math.random() * (max - min + 1) + min)
            }

            function eleccion(jugada) {
                let resultado = ""
                if(jugada == 1) {
                    resultado = "Piedra 🪨"
                } else if(jugada == 2) {
                    resultado = "Papel 📄"
                } else if(jugada = 3) {
                    resultado = "Tijeras ✂️"
                } else {
                    resultado = "Mal elegido 👎"
                }
                return resultado
            }
            //1 es piedra, 2 es papel, 3 es tijeras
            let jugador = 0
            let pc = 0
            
            while (triunfos < 3 && perdidas < 3) {
                aleatorio(1, 3)
                jugador = prompt("Elige: 1 para piedra, 2 para papel, 3 para tijeras")
                //alert("Elegiste " + jugador)
                if(jugador == 1) {
                    alert("Elegiste piedra 🪨")
                } else if(jugador == 2) {
                    alert("Elegiste papel 📄")
                } else if(jugador == 3) {
                    alert("Elegiste tijeras ✂️")
                } else {
                    alert("Elegiste PERDER")
                }
                if(pc == 1) {
                    alert("pc elegige piedra 🪨")
                } else if(pc == 2) {
                    alert("pc elige papel 📄")
                } else if(pc == 3) {
                    alert("pc elige tijeras ✂️")
                }
                //Combate 
                if(pc == jugador) {
                    alert("EMPATE 🤝")
                } else if(jugador == 1 && pc == 3) {
                    alert("GANASTE 🥳")
                    triunfos = triunfos + 1
                } else if(jugador == 2 && pc == 1) {
                    alert("GANASTE 🥳")
                    triunfos = triunfos + 1
                } else if(jugador == 3 && pc == 2) {
                    alert("GANASTE 🥳")
                    triunfos = triunfos + 1
                } else {
                    alert("PERDISTE 😔")
                    perdidas = perdidas + 1
                }
            }

            alert("Ganaste " + triunfos + "veces. Perdiste " + perdidas + "veces")
            
        </script>
    </head>
    <body>
        <h1>Piedra, Papel o Tijeras</h1>
    </body>
</html>
